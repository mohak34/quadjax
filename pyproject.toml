[project]
name = "quadjax"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mohak34", email = "mohaks0408@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jax[cuda13]>=0.12.0.1",
